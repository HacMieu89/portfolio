<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="cyanRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="200" r="350" fill="url(#cyanRadial)"/>

  <!-- Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Brand Badge -->
  <rect x="80" y="80" width="180" height="40" rx="20" fill="#0891b2" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.4"/>
  <circle cx="105" cy="100" r="6" fill="#22d3ee"/>
  <text x="125" y="106" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" fill="#22d3ee">devops.ai //</text>

  <!-- Title -->
  <text x="80" y="220" font-family="'Plus Jakarta Sans', sans-serif" font-size="56" font-weight="800" fill="#ffffff">
    Kỹ sư <tspan fill="url(#glow)">DevOps &amp; AI Automation</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="290" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="400" fill="#94a3b8">
    Hạ tầng tự động hóa chịu tải cao 10.000+ tasks/ngày • Giảm 80% chi phí AI Token • Uptime 99.9%
  </text>

  <!-- Metric Badges -->
  <g transform="translate(80, 360)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="230" height="110" rx="16" fill="#111827" fill-opacity="0.8" stroke="#1e293b"/>
    <text x="30" y="55" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="800" fill="#22d3ee">10k+</text>
    <text x="30" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#64748b">Tasks / Ngày</text>

    <!-- Badge 2 -->
    <rect x="250" y="0" width="230" height="110" rx="16" fill="#111827" fill-opacity="0.8" stroke="#1e293b"/>
    <text x="280" y="55" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="800" fill="#34d399">99.9%</text>
    <text x="280" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#64748b">Uptime Cam kết</text>

    <!-- Badge 3 -->
    <rect x="500" y="0" width="230" height="110" rx="16" fill="#111827" fill-opacity="0.8" stroke="#1e293b"/>
    <text x="530" y="55" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="800" fill="#a855f7">&lt;50ms</text>
    <text x="530" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#64748b">Ingestion Speed</text>

    <!-- Badge 4 -->
    <rect x="750" y="0" width="230" height="110" rx="16" fill="#111827" fill-opacity="0.8" stroke="#1e293b"/>
    <text x="780" y="55" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="800" fill="#fbbf24">-80%</text>
    <text x="780" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#64748b">Chi Phí Token AI</text>
  </g>

  <!-- Footer Info -->
  <text x="80" y="540" font-family="'JetBrains Mono', monospace" font-size="18" fill="#64748b">
    Email: chientrantrong89@gmail.com | Portfolio: chientrantrong.github.io
  </text>
</svg>
